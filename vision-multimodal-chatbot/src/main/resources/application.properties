spring.application.name=Vision

# ---- Gemini chat (Google AI Studio / Gemini Developer API) ----
spring.ai.google.genai.api-key=AQ.Ab8RN6KZLsp5pQpewzse8SuoFEkqDzOwBCPfHyWg
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.max-output-tokens=8192

# ---- Gemini embeddings (used by RAG) ----
# The Pinecone index dimension MUST equal spring.ai.google.genai.embedding.text.dimensions.
spring.ai.google.genai.embedding.api-key=AQ.Ab8RN6K88XopQpewzse8SuoFEkqDzOwBCPfHyWg
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# ---- Pinecone (create the index first: dimension 768, metric cosine) ----
spring.ai.vectorstore.pinecone.api-key=pcsk_5YrumG_M5yfTin7k3G2eqEpcBaVfrfFj1XkNY3ZxA2zgoYxLDWgx5tycv4zs
spring.ai.vectorstore.pinecone.index-name=vision-rag-vectors
spring.ai.vectorstore.pinecone.namespace=vision

# PostgreSQL Database Configuration

spring.datasource.url=jdbc:postgresql://my-first-postgres-service-97db5b80.pgq3cd2kk72p1g3j7j6w10zm2a.c0.ap-south-1.aws.pg.clickhouse.cloud:5432/postgres

spring.datasource.username=postgres
spring.datasource.password=ghuVCafoiL

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ---- PostgreSQL: persistent chat memory + document registry ----
# `docker compose up -d` starts a matching local database (see docker-compose.yml).

# Spring AI creates SPRING_AI_CHAT_MEMORY; schema.sql creates rag_document / rag_chunk.
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.sql.init.mode=always

# ---- App settings ----
# Messages of history sent to Gemini per request.
app.chat.max-history-messages=20
# Passages retrieved per question, and a guard against huge uploads being embedded.
app.rag.top-k=5
app.rag.max-chunks-per-document=500

# Multipart upload limits. Increase only if your use case needs it.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

server.port=8080

# Optional logging while developing
logging.level.org.springframework.ai=INFO


